<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprendre Français</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#1e3a5f;color:white;padding:22px;text-align:center}
h1{margin:0 0 6px;font-size:25px}
main{padding:16px;padding-bottom:90px}
.section{display:none}
.section.active{display:block}
.filters{display:flex;gap:7px;overflow-x:auto;margin-bottom:15px}
button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;cursor:pointer}
.filter{background:#dbe7f5;color:#17324f;white-space:nowrap}
.filter.active{background:#1e3a5f;color:white}
.card{background:white;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #0001}
.word{font-size:21px;font-weight:bold;color:#1e3a5f}
.pron{font-size:14px;color:#777;margin-top:5px}
.ar{margin-top:8px;font-size:17px}
.big{width:100%;background:#1e3a5f;color:white;margin:10px 0}
.quiz-option{display:block;width:100%;margin:9px 0;background:white;border:2px solid #dbe2ea}
.correct{background:#b9efc5!important}
.wrong{background:#ffbcbc!important}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:25px}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:8px;box-shadow:0 -2px 10px #0002}
.nav button{background:transparent;font-size:13px}
.nav button.active{color:#1e3a5f;font-weight:bold}
.score{text-align:center;font-size:20px;margin:15px}
</style>
</head>

<body>

<header>
<h1>🇫🇷 Apprendre Français</h1>
<div>تعلم الفرنسية بطريقة سهلة</div>
</header>

<main>

<section id="vocab" class="section active">
<h2>📚 المفردات</h2>

<div class="filters">
<button class="filter active" data-cat="all">الكل</button>
<button class="filter" data-cat="greetings">تحيات</button>
<button class="filter" data-cat="numbers">أرقام</button>
<button class="filter" data-cat="food">طعام</button>
<button class="filter" data-cat="family">عائلة</button>
<button class="filter" data-cat="days">أيام</button>
</div>

<div id="vocabList"></div>
</section>

<section id="phrases" class="section">
<h2>💬 العبارات</h2>
<div id="phrasesList"></div>
</section>

<section id="quiz" class="section">
<h2>🧠 الاختبار</h2>
<div id="quizStart">
<p>اختبر معلوماتك في الفرنسية.</p>
<button id="startQuiz" class="big">ابدأ الاختبار</button>
</div>

<div id="quizGame" style="display:none">
<div class="score">السؤال <span id="qNumber">1</span>/10 — النقاط: <span id="score">0</span></div>
<h2 id="question"></h2>
<div id="options"></div>
</div>

<div id="quizResult" style="display:none;text-align:center">
<h2>🎉 انتهى الاختبار</h2>
<div class="score">نتيجتك: <span id="finalScore">0</span>/10</div>
<button id="restartQuiz" class="big">إعادة الاختبار</button>
</div>
</section>

<section id="ai" class="section">
<h2>🗣️ أستاذ الفرنسية AI</h2>
<div class="card">
<p>تحدث مع أستاذك بالفرنسية، وسيصحح أخطاءك ويشرحها بالعربية.</p>
<label>مستواك:</label>
<select id="aiLevel" style="width:100%;padding:12px;margin:8px 0;border-radius:10px">
<option>A1</option>
<option>A2</option>
<option>B1</option>
<option>B2</option>
</select>
<div id="aiChat" style="max-height:400px;overflow:auto;margin:10px 0"></div>
<input id="aiInput" type="text" placeholder="اكتب بالفرنسية..." style="width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px">
<button id="aiSend" class="big">إرسال ➤</button>
<div id="aiStatus" style="text-align:center;color:#777"></div>
</div>
</section>

<section id="flashcards" class="section">
<h2>🃏 البطاقات</h2>
<div id="flash" class="card flash"></div>
<button id="prev" class="big">السابق</button>
<button id="flip" class="big">قلب البطاقة</button>
<button id="next" class="big">التالي</button>
<button id="known" class="big">✓ عرفتها</button>
<div class="score">عرفت: <span id="knownCount">0</span></div>
</section>

</main>

<nav class="nav">
<button class="active" data-page="vocab">📚<br>كلمات</button>
<button data-page="phrases">💬<br>عبارات</button>
<button data-page="quiz">🧠<br>اختبار</button>
<button data-page="flashcards">🃏<br>بطاقات</button>
<button data-page="ai">🗣️<br>AI</button>
</nav>

<script>
const data={
greetings:[
['Bonjour','صباح الخير / مرحباً','بونجور'],
['Bonsoir','مساء الخير','بونسوار'],
['Salut','مرحباً / وداعاً','سالو'],
['Merci','شكراً','ميرسي'],
['Oui','نعم','وي'],
['Non','لا','نون'],
['Au revoir','إلى اللقاء','أو رفوار'],
['Bienvenue','أهلاً وسهلاً','بيانفنو']
],
numbers:[
['Un','واحد','أن'],['Deux','اثنان','دو'],['Trois','ثلاثة','تروا'],
['Quatre','أربعة','كاتر'],['Cinq','خمسة','سانك'],['Six','ستة','سيس'],
['Sept','سبعة','سيت'],['Huit','ثمانية','ويت'],['Neuf','تسعة','نوف'],
['Dix','عشرة','ديس']
],
food:[
['Pain','خبز','بان'],['Eau','ماء','أو'],['Café','قهوة','كافيه'],
['Pomme','تفاحة','بوم'],['Lait','حليب','ليه'],
['Viande','لحم','فياند'],['Légumes','خضار','ليجوم'],
['Gâteau','كعكة','جاتو'],['Fromage','جبن','فروماج'],
['Poisson','سمك','بواسون']
],
family:[
['Mère','أم','مير'],['Père','أب','بير'],['Sœur','أخت','سور'],
['Frère','أخ','فرير'],['Enfant','طفل','أنفان'],
['Ami','صديق','أمي'],['Femme','امرأة / زوجة','فام'],
['Homme','رجل / زوج','أوم']
],
days:[
['Lundi','الإثنين','لوندي'],['Mardi','الثلاثاء','ماردي'],
['Mercredi','الأربعاء','ميركردي'],['Jeudi','الخميس','جودي'],
['Vendredi','الجمعة','فوندردي'],['Samedi','السبت','سامدي'],
['Dimanche','الأحد','ديمونش']
]
};

const phrases=[
['Comment allez-vous ?','كيف حالك؟','كومون أليه فو؟'],
['Je vais bien, merci.','أنا بخير، شكراً.','جو في بيان، ميرسي.'],
['Comment vous appelez-vous ?','ما اسمك؟','كومون فو أبيليه فو؟'],
['Je m’appelle...','اسمي...','جو مابيل'],
['D’où venez-vous ?','من أين أنت؟','دو فونيه فو؟'],
['Je ne comprends pas.','لا أفهم.','جو نو كومبرون با'],
['Parlez plus lentement.','تحدث ببطء.','بارليه بلي لانتمو'],
['Combien ça coûte ?','كم سعر هذا؟','كومبيان سا كوت؟']
];

let all=[];
Object.values(data).forEach(x=>all.push(...x));

function speak(text){
if('speechSynthesis' in window){
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(text);
u.lang='fr-FR';
u.rate=.85;
speechSynthesis.speak(u);
}
}

function showVocab(cat='all'){
let list=cat==='all'?all:data[cat];
document.getElementById('vocabList').innerHTML='';
list.forEach(x=>{
let c=document.createElement('div');
c.className='card';
c.innerHTML='<div class="word">'+x[0]+'</div><div class="pron">'+x[2]+'</div><div class="ar">'+x[1]+'</div>';
c.addEventListener('click',()=>speak(x[0]));
document.getElementById('vocabList').appendChild(c);
});
}

function showPhrases(){
let box=document.getElementById('phrasesList');
box.innerHTML='';
phrases.forEach(x=>{
let c=document.createElement('div');
c.className='card';
c.innerHTML='<div class="word">'+x[0]+'</div><div class="pron">'+x[2]+'</div><div class="ar">'+x[1]+'</div>';
c.addEventListener('click',()=>speak(x[0]));
box.appendChild(c);
});
}

document.querySelectorAll('.filter').forEach(b=>{
b.addEventListener('click',()=>{
document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
b.classList.add('active');
showVocab(b.dataset.cat);
});
});

document.querySelectorAll('.nav button').forEach(b=>{
b.addEventListener('click',()=>{
document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
b.classList.add('active');
document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
document.getElementById(b.dataset.page).classList.add('active');
});
});

let quiz=[],qi=0,score=0;

function startQuiz(){
quiz=[];
for(let i=0;i<10;i++){
let correct=all[Math.floor(Math.random()*all.length)];
let opts=[correct];
while(opts.length<4){
let x=all[Math.floor(Math.random()*all.length)];
if(!opts.includes(x))opts.push(x);
}
opts.sort(()=>Math.random()-.5);
quiz.push({correct,opts});
}
qi=0;score=0;
document.getElementById('quizStart').style.display='none';
document.getElementById('quizResult').style.display='none';
document.getElementById('quizGame').style.display='block';
showQuestion();
}

function showQuestion(){
let q=quiz[qi];
document.getElementById('qNumber').textContent=qi+1;
document.getElementById('score').textContent=score;
document.getElementById('question').textContent=q.correct[0];
let box=document.getElementById('options');
box.innerHTML='';
q.opts.forEach(x=>{
let b=document.createElement('button');
b.className='quiz-option';
b.textContent=x[1];
b.addEventListener('click',()=>{
document.querySelectorAll('.quiz-option').forEach(y=>y.disabled=true);
if(x===q.correct){
b.classList.add('correct');score++;
}else{
b.classList.add('wrong');
}
setTimeout(()=>{
qi++;
if(qi>=10){
document.getElementById('quizGame').style.display='none';
document.getElementById('quizResult').style.display='block';
document.getElementById('finalScore').textContent=score;
}else showQuestion();
},600);
});
box.appendChild(b);
});
}

document.getElementById('startQuiz').addEventListener('click',startQuiz);
document.getElementById('restartQuiz').addEventListener('click',startQuiz);


const aiInput=document.getElementById('aiInput');
const aiSend=document.getElementById('aiSend');
const aiChat=document.getElementById('aiChat');
const aiStatus=document.getElementById('aiStatus');

function addAIMessage(text,me){
  const d=document.createElement('div');
  d.className='card';
  d.style.background=me?'#e5f0ff':'#ffffff';
  d.style.textAlign=me?'left':'right';

  const t=document.createElement('div');
  t.textContent=text;
  d.appendChild(t);

  if(!me){
    const b=document.createElement('button');
    b.textContent='🔊 استمع';
    b.style.marginTop='10px';
    b.style.padding='8px 14px';
    b.style.borderRadius='10px';
    b.style.border='none';
    b.style.cursor='pointer';
    b.onclick=function(){
      speak(text);
    };
    d.appendChild(b);
  }

  aiChat.appendChild(d);
  aiChat.scrollTop=aiChat.scrollHeight;
}

async function sendAI(){
  const message=aiInput.value.trim();
  if(!message)return;

  addAIMessage(message,true);
  aiInput.value='';
  aiSend.disabled=true;
  aiStatus.textContent='جاري التفكير...';

  try{
    const response=await fetch('http://10.127.147.90:5000/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        message:message,
        level:document.getElementById('aiLevel').value
      })
    });

    const raw=await response.text();
    console.log('AI HTTP:',response.status,raw);

    let data;
    try{
      data=JSON.parse(raw);
    }catch(e){
      throw new Error('رد غير صالح من API: '+raw);
    }

    if(data.reply){
      addAIMessage(data.reply,false);
    }else{
      addAIMessage('API لم يُرجع ردًا: '+raw,false);
    }

  }catch(e){
    console.error('AI ERROR:',e);
    addAIMessage('خطأ الاتصال: '+e.message,false);
  }finally{
    aiStatus.textContent='';
    aiSend.disabled=false;
  }
}
aiSend.addEventListener('click',sendAI);

aiInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    sendAI();
  }
});

let fc=0,flipped=false,known=new Set();

function showCard(){
let x=all[fc];
document.getElementById('flash').innerHTML=flipped?
'<div class="word">'+x[1]+'</div><div class="pron">'+x[2]+'</div>':
'<div class="word">'+x[0]+'</div><div>اضغط قلب البطاقة</div>';
}

document.getElementById('flip').addEventListener('click',()=>{
flipped=!flipped;showCard();
});
document.getElementById('next').addEventListener('click',()=>{
fc=(fc+1)%all.length;flipped=false;showCard();
});
document.getElementById('prev').addEventListener('click',()=>{
fc=(fc-1+all.length)%all.length;flipped=false;showCard();
});
document.getElementById('known').addEventListener('click',()=>{
known.add(fc);
document.getElementById('knownCount').textContent=known.size;
fc=(fc+1)%all.length;flipped=false;showCard();
});

showVocab();
showPhrases();
showCard();
</script>

</body>
</html>
